name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (with OS deps)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS deps only (cache hit)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright tests
        id: run-tests
        run: npm run test:e2e

      - name: Generate job summary
        if: always()
        run: |
          REPORT="playwright-report/results.json"
          STOPPED_LOG=".playwright-retry-stats/stopped.log"
          {
            echo "## 🎭 Playwright E2E — Résumé"
            echo ""
            if [ -f "$REPORT" ]; then
              node -e "
                const r = require('./' + process.env.REPORT);
                const fs = require('fs');
                const s = r.stats || {};
                const dur = s.duration ? (s.duration / 1000).toFixed(2) + ' s' : 'n/a';
                const expected = s.expected ?? 0;
                const unexpected = s.unexpected ?? 0;
                const flaky = s.flaky ?? 0;
                const skipped = s.skipped ?? 0;
                const total = expected + unexpected + flaky + skipped;
                const status = unexpected > 0 ? '❌ Échec' : '✅ Succès';
                // Retries :
                //  - retriesTotal   = nombre total de tentatives de retry, toutes
                //                     tentatives confondues (chaque résultat avec retry > 0).
                //  - retriesPerTest = nombre de tests distincts ayant subi >= 1 retry.
                let retriesTotal = 0;
                const retriedTestIds = new Set();
                const walkAll = (suite, fn) => {
                  (suite.suites || []).forEach((s) => walkAll(s, fn));
                  (suite.specs || []).forEach((sp) => {
                    (sp.tests || []).forEach((t) => {
                      (t.results || []).forEach((res) => fn(sp, t, res));
                    });
                  });
                };
                (r.suites || []).forEach((s) => walkAll(s, (_sp, t, res) => {
                  if ((res.retry ?? 0) > 0) {
                    retriesTotal++;
                    retriedTestIds.add(t.id || t.testId || (t.title + ':' + (res.workerIndex ?? '')));
                  }
                }));
                const retriesPerTest = retriedTestIds.size;
                // Compte les retries stoppés (déterministes) via le log écrit par retry-filter.ts
                let retriesStopped = 0;
                const stoppedTitles = [];
                try {
                  const log = fs.readFileSync(process.env.STOPPED_LOG, 'utf8');
                  const lines = log.split('\n').filter(Boolean);
                  retriesStopped = lines.length;
                  lines.forEach((l) => {
                    const [, title] = l.split('\t');
                    if (title) stoppedTitles.push(title);
                  });
                } catch {}
                console.log('| Métrique | Valeur |');
                console.log('| --- | --- |');
                console.log('| Statut | ' + status + ' |');
                console.log('| Durée totale | ' + dur + ' |');
                console.log('| Tests exécutés | ' + total + ' |');
                console.log('| ✅ Réussis | ' + expected + ' |');
                console.log('| ❌ Échecs | ' + unexpected + ' |');
                console.log('| ⚠️ Flaky | ' + flaky + ' |');
                console.log('| ⏭️ Ignorés | ' + skipped + ' |');
                console.log('| 🔁 Retries totaux déclenchés | ' + retriesTotal + ' |');
                console.log('| 🔂 Tests ayant subi un retry | ' + retriesPerTest + ' |');
                console.log('| 🛑 Retries stoppés (déterministes) | ' + retriesStopped + ' |');
                if (stoppedTitles.length > 0) {
                  console.log('');
                  console.log('### 🛑 Retries stoppés par erreur déterministe');
                  stoppedTitles.forEach((t) => console.log('- ' + t));
                }
                if (unexpected > 0) {
                  console.log('');
                  console.log('### Tests en échec');
                  const failed = [];
                  const walk = (suite) => {
                    (suite.suites || []).forEach(walk);
                    (suite.specs || []).forEach(sp => {
                      (sp.tests || []).forEach(t => {
                        const ok = (t.results || []).some(res => res.status === 'passed');
                        const bad = (t.results || []).some(res => res.status === 'failed' || res.status === 'timedOut');
                        if (bad && !ok) failed.push((sp.file || suite.file || '') + ' › ' + sp.title);
                      });
                    });
                  };
                  (r.suites || []).forEach(walk);
                  failed.forEach(f => console.log('- ' + f));
                }
                // Patterns réseau/timeout autorisés au retry
                console.log('');
                console.log('### 🌐 Patterns réseau/timeout éligibles au retry');
                try {
                  const mod = require('./e2e/utils/retry-patterns.ts');
                  const pats = (mod.RETRYABLE_PATTERNS || []).map((p) => '\`' + p.toString() + '\`');
                  if (pats.length) {
                    pats.forEach((p) => console.log('- ' + p));
                  } else {
                    console.log('_Aucun pattern exporté._');
                  }
                } catch (e) {
                  // Fallback statique si le require TS échoue (Node sans loader TS)
                  const fallback = [
                    '/timeout/i','/timed out/i','/net::ERR_/i','/ECONNREFUSED/i',
                    '/ECONNRESET/i','/ETIMEDOUT/i','/ENOTFOUND/i','/EAI_AGAIN/i',
                    '/socket hang up/i','/network/i','/navigation failed/i',
                    '/Target page, context or browser has been closed/i',
                  ];
                  fallback.forEach((p) => console.log('- \`' + p + '\`'));
                }
              "
            else
              echo "_Rapport JSON introuvable (\`$REPORT\`)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REPORT: playwright-report/results.json
          STOPPED_LOG: .playwright-retry-stats/stopped.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7