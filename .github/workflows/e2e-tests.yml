name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    paths:
      - 'e2e/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-tests.yml'

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (with OS deps)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright OS deps only (cache hit)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright tests
        id: run-tests
        run: npm run test:e2e

      - name: Generate job summary
        if: always()
        run: |
          REPORT="playwright-report/results.json"
          {
            echo "## 🎭 Playwright E2E — Résumé"
            echo ""
            if [ -f "$REPORT" ]; then
              node -e "
                const r = require('./' + process.env.REPORT);
                const s = r.stats || {};
                const dur = s.duration ? (s.duration / 1000).toFixed(2) + ' s' : 'n/a';
                const expected = s.expected ?? 0;
                const unexpected = s.unexpected ?? 0;
                const flaky = s.flaky ?? 0;
                const skipped = s.skipped ?? 0;
                const total = expected + unexpected + flaky + skipped;
                const status = unexpected > 0 ? '❌ Échec' : '✅ Succès';
                console.log('| Métrique | Valeur |');
                console.log('| --- | --- |');
                console.log('| Statut | ' + status + ' |');
                console.log('| Durée totale | ' + dur + ' |');
                console.log('| Tests exécutés | ' + total + ' |');
                console.log('| ✅ Réussis | ' + expected + ' |');
                console.log('| ❌ Échecs | ' + unexpected + ' |');
                console.log('| ⚠️ Flaky | ' + flaky + ' |');
                console.log('| ⏭️ Ignorés | ' + skipped + ' |');
                if (unexpected > 0) {
                  console.log('');
                  console.log('### Tests en échec');
                  const failed = [];
                  const walk = (suite) => {
                    (suite.suites || []).forEach(walk);
                    (suite.specs || []).forEach(sp => {
                      (sp.tests || []).forEach(t => {
                        const ok = (t.results || []).some(res => res.status === 'passed');
                        const bad = (t.results || []).some(res => res.status === 'failed' || res.status === 'timedOut');
                        if (bad && !ok) failed.push((sp.file || suite.file || '') + ' › ' + sp.title);
                      });
                    });
                  };
                  (r.suites || []).forEach(walk);
                  failed.forEach(f => console.log('- ' + f));
                }
              "
            else
              echo "_Rapport JSON introuvable (\`$REPORT\`)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REPORT: playwright-report/results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7