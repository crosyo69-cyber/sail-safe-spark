name: E2E Lint

on:
  push:
    branches: ['**']
    # Pas de filtre `paths:` ici — `no-empty-pattern` doit tourner sur
    # chaque push pour rester un check obligatoire fiable. Les autres
    # jobs filtrent leurs propres invocations via `if:` si besoin.
  pull_request:
    # Idem : aucune restriction `paths:` afin que GitHub publie
    # toujours un statut `no-empty-pattern` exploitable en branch
    # protection (sans filtre, un check requis "skipped" bloque la PR).

jobs:
  no-duplicate-imports:
    name: ESLint — no duplicate imports in e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules-lint
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-modules-

      - name: Install dependencies
        if: steps.cache-node-modules-lint.outputs.cache-hit != 'true'
        run: npm ci

      - name: Fail on duplicate imports in e2e/
        run: npm run lint:e2e:duplicate-imports

  no-empty-pattern:
    name: ESLint — no-empty-pattern (src/ + e2e/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules-empty-pattern
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-modules-

      - name: Install dependencies
        if: steps.cache-node-modules-empty-pattern.outputs.cache-hit != 'true'
        run: npm ci

      - name: Fail on empty destructuring patterns
        run: npm run lint:no-empty-pattern

  no-empty-pattern-guard:
    name: Guard — no-empty-pattern job présent dans le workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier que le job no-empty-pattern et sa commande sont déclarés
        shell: bash
        run: |
          set -euo pipefail
          WF=".github/workflows/e2e-lint.yml"

          # 1) Le job doit exister, sinon branch protection ne pourra pas
          #    le marquer "required".
          if ! grep -qE '^\s*no-empty-pattern\s*:' "$WF"; then
            echo "::error file=$WF::Job 'no-empty-pattern' introuvable dans $WF"
            exit 1
          fi

          # 2) La commande de lint doit toujours être appelée.
          if ! grep -q 'npm run lint:no-empty-pattern' "$WF"; then
            echo "::error file=$WF::Step 'npm run lint:no-empty-pattern' manquant dans $WF"
            exit 1
          fi

          # 3) Aucun filtre `paths:` ne doit restreindre les triggers du
          #    workflow — sinon le check 'no-empty-pattern' peut être
          #    "skipped" et bloquer toute PR sur laquelle il est requis.
          if grep -qE '^\s{2,}paths\s*:' "$WF"; then
            echo "::error file=$WF::Filtre 'paths:' détecté ; il rendrait le check no-empty-pattern non systématique"
            exit 1
          fi

          # 4) Le déclencheur pull_request doit exister.
          if ! grep -qE '^\s*pull_request\s*:' "$WF"; then
            echo "::error file=$WF::Trigger 'pull_request' manquant — le job ne tournera pas sur les PR"
            exit 1
          fi

          # 5) Le déclencheur push doit couvrir toutes les branches.
          if ! grep -qE "branches:\s*\[\s*'\*\*'\s*\]" "$WF"; then
            echo "::error file=$WF::Trigger 'push' doit cibler branches: ['**'] pour couvrir chaque branche"
            exit 1
          fi

          echo "✓ no-empty-pattern job correctement câblé dans $WF"

  typecheck-e2e:
    name: TypeScript typecheck — e2e/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules-typecheck
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-modules-

      - name: Install dependencies
        if: steps.cache-node-modules-typecheck.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run TypeScript typecheck on e2e/
        run: npm run typecheck:e2e
