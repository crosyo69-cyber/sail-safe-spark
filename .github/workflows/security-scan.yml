name: Security Scan

# Catch new warn-level security issues early.
# - npm audit blocks merges when a new high/critical advisory appears in
#   dependencies (except packages explicitly whitelisted as accepted risk,
#   e.g. xlsx — see @security-memory for the rationale).
# - Supabase DB linter flags new RLS / SECURITY DEFINER / search_path issues
#   on each push if SUPABASE_ACCESS_TOKEN is configured as a repo secret.
#   Without that secret the job is skipped so forks / first-time setups do
#   not fail on a missing credential.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly re-scan to surface newly disclosed CVEs even on quiet branches.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  supabase-token-guard:
    name: Guard — SUPABASE_ACCESS_TOKEN present and rotated
    runs-on: ubuntu-latest
    steps:
      - name: Verify token is set and not the revoked one
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # SHA-256 of any token(s) that must NEVER be accepted again
          # (e.g. the revoked `sbp_a685…1286`). Store as a repo variable
          # (Settings → Secrets and variables → Actions → Variables) named
          # REVOKED_SUPABASE_TOKEN_SHA256. Multiple hashes can be provided
          # space- or comma-separated. Compute locally with:
          #   printf '%s' "$OLD_TOKEN" | sha256sum
          REVOKED_TOKEN_SHA256: ${{ vars.REVOKED_SUPABASE_TOKEN_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error ::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [[ ! "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]]; then
            echo "::error ::SUPABASE_ACCESS_TOKEN does not look like a valid Supabase personal access token (expected sbp_… format)."
            exit 1
          fi

          ACTUAL_SHA=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | awk '{print $1}')
          if [ -n "${REVOKED_TOKEN_SHA256:-}" ]; then
            # Normalise separators (comma or whitespace) into newlines.
            while IFS= read -r bad; do
              [ -z "$bad" ] && continue
              if [ "$ACTUAL_SHA" = "$bad" ]; then
                echo "::error ::SUPABASE_ACCESS_TOKEN matches a revoked token hash. Generate a new token in Supabase and update the GitHub secret."
                exit 1
              fi
            done < <(printf '%s' "$REVOKED_TOKEN_SHA256" | tr ', ' '\n\n')
          else
            echo "::notice ::Repo variable REVOKED_SUPABASE_TOKEN_SHA256 not set — skipping revoked-token comparison. Add it to enforce rotation."
          fi

          echo "OK — SUPABASE_ACCESS_TOKEN is set and does not match the revoked token."

  npm-audit:
    name: npm audit — high & critical advisories
    runs-on: ubuntu-latest
    # Report-only: most current advisories hit build/dev tooling (vite,
    # rollup, postcss, eslint) that never ships to visitors. Alerts stay
    # visible in the job log but no longer block merges.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit (high+) with allowlist
        shell: bash
        run: |
          set -euo pipefail

          # Packages whose advisory has been reviewed and accepted as
          # non-exploitable in this project. Keep in sync with
          # @security-memory so reviewers can audit each waiver.
          #   - xlsx: only used to GENERATE admin XLSX exports from trusted
          #     internal data; never parses untrusted spreadsheets, so the
          #     SheetJS Prototype Pollution / ReDoS advisories do not apply.
          ALLOWLIST=("xlsx")

          npm audit --audit-level=high --json > audit.json || true

          node -e '
            const fs = require("fs");
            const allow = new Set(process.argv.slice(1));
            const report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const vulns = report.vulnerabilities || {};
            const offenders = [];
            for (const [name, info] of Object.entries(vulns)) {
              if (!["high", "critical"].includes(info.severity)) continue;
              if (allow.has(name)) {
                console.log(`::notice ::Allowlisted advisory for ${name} (${info.severity})`);
                continue;
              }
              offenders.push(`${name} (${info.severity})`);
            }
            if (offenders.length) {
              console.log("::error ::High/critical advisories not in allowlist:");
              offenders.forEach((o) => console.log(`::error ::  - ${o}`));
              process.exit(1);
            }
            console.log("OK — no new high/critical advisories outside allowlist");
          ' "${ALLOWLIST[@]}"

  supabase-linter:
    name: Supabase DB linter
    runs-on: ubuntu-latest
    # The backend is hosted on Lovable Cloud: neither `supabase db lint`
    # (needs a direct DB connection) nor the Management API Security Advisor
    # (personal token gets 401 on this project) can reach it from CI.
    # This step does NOT run any check: it only flags that the database must
    # be reviewed in the Lovable Security Advisor. Accepted risks are
    # documented in the security note, not here.
    steps:
      - name: Database check not runnable from GitHub
        shell: bash
        run: |
          echo "::warning ::Contrôle de la base non exécutable depuis GitHub (backend Lovable Cloud) — à vérifier dans le Security Advisor Lovable"
