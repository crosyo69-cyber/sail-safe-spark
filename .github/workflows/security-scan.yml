name: Security Scan

# Catch new warn-level security issues early.
# - npm audit blocks merges when a new high/critical advisory appears in
#   dependencies (except packages explicitly whitelisted as accepted risk,
#   e.g. xlsx — see @security-memory for the rationale).
# - Supabase DB linter flags new RLS / SECURITY DEFINER / search_path issues
#   on each push if SUPABASE_ACCESS_TOKEN is configured as a repo secret.
#   Without that secret the job is skipped so forks / first-time setups do
#   not fail on a missing credential.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly re-scan to surface newly disclosed CVEs even on quiet branches.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  supabase-token-guard:
    name: Guard — SUPABASE_ACCESS_TOKEN present and rotated
    runs-on: ubuntu-latest
    steps:
      - name: Verify token is set and not the revoked one
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # SHA-256 of the revoked token `sbp_a685…1286` (full value never
          # committed). If a future rotation is needed, recompute with:
          #   printf '%s' "$OLD_TOKEN" | sha256sum
          REVOKED_TOKEN_SHA256: "b6f3a0d6f1b0c4e6f2a4d8e9c1b3a5d7e9f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9"
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error ::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [[ ! "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]]; then
            echo "::error ::SUPABASE_ACCESS_TOKEN does not look like a valid Supabase personal access token (expected sbp_… format)."
            exit 1
          fi

          ACTUAL_SHA=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | awk '{print $1}')
          if [ "$ACTUAL_SHA" = "$REVOKED_TOKEN_SHA256" ]; then
            echo "::error ::SUPABASE_ACCESS_TOKEN still matches a previously revoked token. Generate a new one in Supabase and update the GitHub secret."
            exit 1
          fi

          echo "OK — SUPABASE_ACCESS_TOKEN is set and does not match the revoked token."

  npm-audit:
    name: npm audit — high & critical advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit (high+) with allowlist
        shell: bash
        run: |
          set -euo pipefail

          # Packages whose advisory has been reviewed and accepted as
          # non-exploitable in this project. Keep in sync with
          # @security-memory so reviewers can audit each waiver.
          #   - xlsx: only used to GENERATE admin XLSX exports from trusted
          #     internal data; never parses untrusted spreadsheets, so the
          #     SheetJS Prototype Pollution / ReDoS advisories do not apply.
          ALLOWLIST=("xlsx")

          npm audit --audit-level=high --json > audit.json || true

          node -e '
            const fs = require("fs");
            const allow = new Set(process.argv.slice(1));
            const report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const vulns = report.vulnerabilities || {};
            const offenders = [];
            for (const [name, info] of Object.entries(vulns)) {
              if (!["high", "critical"].includes(info.severity)) continue;
              if (allow.has(name)) {
                console.log(`::notice ::Allowlisted advisory for ${name} (${info.severity})`);
                continue;
              }
              offenders.push(`${name} (${info.severity})`);
            }
            if (offenders.length) {
              console.log("::error ::High/critical advisories not in allowlist:");
              offenders.forEach((o) => console.log(`::error ::  - ${o}`));
              process.exit(1);
            }
            console.log("OK — no new high/critical advisories outside allowlist");
          ' "${ALLOWLIST[@]}"

  supabase-linter:
    name: Supabase DB linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Supabase credentials
        id: creds
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::SUPABASE_ACCESS_TOKEN not set — skipping Supabase linter. Add it under Settings → Secrets → Actions to enable."
          fi

      - name: Setup Supabase CLI
        if: steps.creds.outputs.have_token == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase DB linter
        if: steps.creds.outputs.have_token == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_REF="unqxudbxxzzmmbwwxwcr"

          supabase db lint --project-ref "$PROJECT_REF" --level warning > lint.txt 2>&1 || true
          cat lint.txt

          # Lints already reviewed and accepted in @security-memory.
          # Only NEW warnings (outside this list) should fail the build.
          IGNORED_LINTS=(
            "0011_function_search_path_mutable"
            "0025_public_bucket_allows_listing"
            "0028_anon_security_definer_function_executable"
            "0029_authenticated_security_definer_function_executable"
          )

          FILTER=$(printf "|%s" "${IGNORED_LINTS[@]}")
          FILTER="${FILTER:1}"

          if grep -Ei "(warn|error)" lint.txt | grep -vE "$FILTER" | grep -q .; then
            echo "::error ::New Supabase lint warnings detected (not in accepted-risk list)"
            grep -Ei "(warn|error)" lint.txt | grep -vE "$FILTER" || true
            exit 1
          fi

          echo "OK — no new Supabase lint warnings outside accepted risks"
